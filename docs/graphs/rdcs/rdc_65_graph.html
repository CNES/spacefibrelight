<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background-color: #1e1e1e;
    }
    linty-viewer {
      display: block;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
  </style>
</head>

<body>
  <linty-viewer href="./rdc_65.lintygraph"></linty-viewer>
  <script src="/spacefibrelight/_static/js/linty-viewer.js"></script>
  <script>
    if (new URLSearchParams(location.search).has('preview')) {
      const viewer = document.querySelector('linty-viewer');
      const apply = () => {
        const root = viewer && viewer.shadowRoot;
        if (!root || !root.querySelector('#paper')) {
          requestAnimationFrame(apply);
          return;
        }
        if (root.querySelector('style[data-preview]')) {
          return;
        }
        const style = document.createElement('style');
        style.dataset.preview = '';
        style.textContent = `
          .flex-horizontal-center,
          .linty-domain-toolbar,
          .linty-fsm-toolbar,
          .linty-logic-circuit-toolbar,
          .joint-navigator {
            display: none !important;
          }
          #paper {
            padding-top: 0 !important;
          }
          .joint-paper-scroller {
            overflow: hidden !important;
            scrollbar-width: none;
          }
        `;
        root.append(style);
      };
      apply();
    }
  </script>
</body>

</html>
